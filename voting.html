<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 투표 앱</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .poll-item {
            margin-bottom: 20px;
            cursor: pointer;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: #fafbfc;
        }
        .poll-item:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }
        .poll-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .bar-container {
            background-color: #e9ecef;
            border-radius: 6px;
            height: 14px;
            overflow: hidden;
            width: 100%;
        }
        .bar {
            background-color: #3498db;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 6px;
        }
        .total-votes {
            text-align: center;
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>실시간 투표 시스템</h2>
        
        <!-- 투표 항목 리스트 -->
        <div id="poll-container">
            <div class="poll-item" data-id="optionA">
                <div class="poll-info">
                    <span class="label">A안 (재택근무 확대)</span>
                    <span class="stats"><span class="count">0</span>표 (<span class="percent">0</span>%)</span>
                </div>
                <div class="bar-container">
                    <div class="bar" id="bar-optionA"></div>
                </div>
            </div>

            <div class="poll-item" data-id="optionB">
                <div class="poll-info">
                    <span class="label">B안 (사무실 출근 유지)</span>
                    <span class="stats"><span class="count">0</span>표 (<span class="percent">0</span>%)</span>
                </div>
                <div class="bar-container">
                    <div class="bar" id="bar-optionB"></div>
                </div>
            </div>

            <div class="poll-item" data-id="optionC">
                <div class="poll-info">
                    <span class="label">C안 (하이브리드 자율근무)</span>
                    <span class="stats"><span class="count">0</span>표 (<span class="percent">0</span>%)</span>
                </div>
                <div class="bar-container">
                    <div class="bar" id="bar-optionC"></div>
                </div>
            </div>
        </div>

        <div class="total-votes">총 투표 수: <span id="total-count">0</span>표</div>
    </div>

    <!-- Firebase 로직 (Script 태그 내부에 통합) -->
    <script type="module">
        // Firebase 설정 (본인의 Firebase 콘솔 설정값으로 교체하세요)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 모듈 임포트 (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const votesRef = ref(db, 'votes');

        // 1. 실시간 데이터 동기화
        onValue(votesRef, (snapshot) => {
            const data = snapshot.val() || {};
            
            const counts = {
                optionA: data.optionA || 0,
                optionB: data.optionB || 0,
                optionC: data.optionC || 0
            };

            const totalVotes = counts.optionA + counts.optionB + counts.optionC;
            document.getElementById('total-count').textContent = totalVotes;

            Object.keys(counts).forEach(id => {
                const count = counts[id];
                const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

                const itemElement = document.querySelector(`.poll-item[data-id="${id}"]`);
                if (itemElement) {
                    itemElement.querySelector('.count').textContent = count;
                    itemElement.querySelector('.percent').textContent = percent;
                    
                    const barElement = document.getElementById(`bar-${id}`);
                    if (barElement) {
                        barElement.style.width = `${percent}%`;
                    }
                }
            });
        });

        // 2. 항목 클릭 시 트랜잭션을 통한 투표 반영
        document.querySelectorAll('.poll-item').forEach(item => {
            item.addEventListener('click', () => {
                const optionId = item.getAttribute('data-id');
                const optionRef = ref(db, `votes/${optionId}`);

                runTransaction(optionRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                }).catch((error) => {
                    console.error("투표 실패:", error);
                });
            });
        });
    </script>
</body>
</html>
